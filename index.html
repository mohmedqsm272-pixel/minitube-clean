
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiniTube</title>

<!-- PWA Settings -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ff3030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MiniTube">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background: #181818;
    border-bottom: 1px solid #292929;
}

.logo {
    color: #ff3030;
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: white;
}

main {
    width: min(850px, 94%);
    margin: 30px auto;
}

.search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.search-box input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    background: #222;
    color: white;
    border: 1px solid #444;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
}

.search-box input:focus {
    border-color: #ff3030;
}

.search-box button {
    background: #ff3030;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 22px;
    font-size: 15px;
    cursor: pointer;
}

.search-box button:hover {
    background: #d92323;
}

#status {
    color: #aaa;
    text-align: center;
    margin: 20px 0;
    font-size: 14px;
}

#results {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.video-card {
    display: grid;
    grid-template-columns: 125px minmax(0, 1fr);
    direction: ltr;
    align-items: center;
    width: 100%;
    background: #202020;
    border: 1px solid #333;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
}

.video-card img {
    grid-column: 1;
    grid-row: 1;
    display: block;
    width: 125px;
    height: 82px;
    object-fit: cover;
}

.video-info {
    grid-column: 2;
    grid-row: 1;
    min-width: 0;
    padding: 10px 14px;
    text-align: left;
}

.video-info h3 {
    font-size: 14px;
    line-height: 1.4;
    margin-bottom: 7px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.video-info p {
    color: #aaa;
    font-size: 12px;
}

.player {
    grid-column: 1 / -1;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: black;
}

.player iframe {
    width: 100%;
    height: 100%;
    border: none;
}

@media (max-width: 500px) {
    main {
        margin-top: 20px;
    }

    .video-card {
        grid-template-columns: 110px minmax(0, 1fr);
    }

    .video-card img {
        width: 110px;
        height: 76px;
    }

    .video-info h3 {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Mini<span>Tube</span></div>
</header>

<main>
    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search for videos..."
        >
        <button onclick="searchVideos()">Search</button>
    </div>

    <div id="status">Search for your favorite videos</div>
    <div id="results"></div>
</main>

<script>
const API_URL = "/api/search";

// Register Service Worker
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
            .then(() => {
                console.log("MiniTube service worker registered");
            })
            .catch(error => {
                console.error("Service Worker error:", error);
            });
    });
}

async function searchVideos() {
    const input = document.getElementById("searchInput");
    const results = document.getElementById("results");
    const status = document.getElementById("status");

    const query = input.value.trim();

    if (!query) {
        status.textContent = "Please enter a search term";
        return;
    }

    results.innerHTML = "";
    status.textContent = "Searching...";

    try {
        const response = await fetch(
            `${API_URL}?q=${encodeURIComponent(query)}`
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error?.message || "Search failed");
        }

        if (!data.items || data.items.length === 0) {
            status.textContent = "No videos found";
            return;
        }

        status.textContent = `${data.items.length} videos found`;

        data.items.forEach(video => {
            const videoId = video.id.videoId;
            const title = video.snippet.title;
            const channel = video.snippet.channelTitle;

            const thumbnail =
                video.snippet.thumbnails.medium?.url ||
                video.snippet.thumbnails.default.url;

            const card = document.createElement("div");
            card.className = "video-card";

            const img = document.createElement("img");
            img.src = thumbnail;
            img.alt = title;

            const info = document.createElement("div");
            info.className = "video-info";

            const heading = document.createElement("h3");
            heading.textContent = title;

            const channelText = document.createElement("p");
            channelText.textContent = channel;

            info.append(heading, channelText);

            const player = document.createElement("div");
            player.className = "player";
            player.hidden = true;

            card.append(img, info, player);

            card.addEventListener("click", () => {
                if (player.hidden) {
                    player.hidden = false;
                    player.innerHTML = `
                        <iframe
                            src="https://www.youtube.com/embed/${videoId}"
                            title="YouTube video player"
                            allowfullscreen
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        ></iframe>
                    `;
                } else {
                    player.hidden = true;
                    player.innerHTML = "";
                }
            });

            results.appendChild(card);
        });

    } catch (error) {
        console.error(error);
        status.textContent =
            "Something went wrong. Make sure the MiniTube server is running.";
    }
}

document.getElementById("searchInput").addEventListener("keydown", event => {
    if (event.key === "Enter") {
        searchVideos();
    }
});
</script>

</body>
</html>
